# P3a 模拟校园系统 + 监控栈(jiaowu / ykt / prometheus / grafana)
# 用法:docker compose -f docker-compose.sims.yml up -d --build
# 镜像拉取失败 → 配 daemon.json registry-mirrors(本机已配 docker.m.daocloud.io)或在文档注记
name: nova-sims

services:
  jiaowu:
    build:
      context: ./sims
      dockerfile: Dockerfile
      args:
        SERVICE: jiaowu
    environment:
      SIM_SERVICE: jiaowu
      POOL_SIZE: "8"
      POOL_WAIT_SECONDS: "2.0"
      SIM_PORT: "8000"
    ports:
      - "9101:8000"
    restart: unless-stopped

  ykt:
    build:
      context: ./sims
      dockerfile: Dockerfile
      args:
        SERVICE: ykt
    environment:
      SIM_SERVICE: ykt
      POOL_SIZE: "10"
      POOL_WAIT_SECONDS: "2.0"
      SIM_PORT: "8000"
    ports:
      - "9102:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./sims/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./sims/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - jiaowu
      - ykt

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # 管理口令一律外部注入:${VAR:?...} 表示未设置时 compose 直接报错退出,
      # 避免出现"默认值人人皆知"的公开仓库默认凭据。用法见 .env.example。
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?必须显式设置 GRAFANA_ADMIN_PASSWORD,例如在 .env 中写入}
      # 匿名只读访问默认关闭;确需本地演示时在 .env 里显式开启。
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ORG_ROLE:-Viewer}
    volumes:
      - ./sims/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./sims/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
